<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bespoke Games</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #f8fafc;
      background: #0f172a;
    }

    main {
      width: min(100%, 620px);
      padding: 48px 32px;
      text-align: center;
      border: 2px solid #475569;
      border-radius: 16px;
      background: #1e293b;
      box-shadow: 0 20px 50px rgb(0 0 0 / 35%);
    }

    h1 {
      margin: 0 0 30px;
      font-size: clamp(36px, 8vw, 58px);
    }

    label {
      display: block;
      margin-bottom: 10px;
      text-align: left;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      margin-bottom: 10px;
      padding: 14px;
      border: 2px solid #94a3b8;
      border-radius: 9px;
      font: inherit;
      resize: vertical;
    }

    .game-button {
      display: block;
      width: 100%;
      margin: 14px 0;
      padding: 18px 24px;
      border: 0;
      border-radius: 10px;
      color: #0f172a;
      background: #e2e8f0;
      font-size: 19px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .game-button:hover,
    .game-button:focus-visible {
      background: #ffffff;
      outline: 3px solid #60a5fa;
      outline-offset: 3px;
    }

    #request-error {
      min-height: 24px;
      margin: 6px 0;
      color: #fca5a5;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>Bespoke Games</h1>
    <label for="game-prompt">Describe the game you want to create</label>
    <textarea id="game-prompt" maxlength="1000" placeholder="Example: Explore an icy castle under the stars."></textarea>
    <p id="request-error" role="alert" aria-live="polite"></p>

    <button class="game-button" type="button" data-mode="narrative" data-path="./fail%20safe/index.html">Create an Interactive Story</button>
    <button class="game-button" type="button" data-mode="platformer" data-path="./Bespoke-Platformer/index.html">Create a Platformer</button>
  </main>

  <script src="./shared/bespoke-game-request.js"></script>
  <script>
    const promptInput = document.getElementById("game-prompt");
    const requestError = document.getElementById("request-error");
    const modeButtons = document.querySelectorAll("[data-mode]");

    modeButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        requestError.textContent = "";

        // Create and save the shared request when the user chooses a mode.
        const result = BespokeGameRequest.save(
          promptInput.value,
          button.dataset.mode
        );

        if (!result.ok) {
          requestError.textContent = result.error;
          promptInput.focus();
          return;
        }

        window.location.href = button.dataset.path;
      });
    });
  </script>
</body>
</html>
